<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="7;url=https://enotas.com.br/guiaconfiguracoes/">
  <title>Guia de Configurações — eNotas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #222222;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      width: 100%;
      max-width: 520px;
      padding: 48px 40px 40px;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,0.35);
    }
    .logo-wrap {
      height: 36px;
      margin-bottom: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-wrap img { height: 100%; width: auto; object-fit: contain; }
    .icon-wrap {
      width: 64px;
      height: 64px;
      background: #111111;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #111111;
      line-height: 1.3;
      margin-bottom: 12px;
    }
    .subtitle {
      font-size: 15px;
      color: #555555;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .countdown-wrap {
      background: #f8f8f8;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 28px;
    }
    .countdown-label {
      font-size: 13px;
      color: #888888;
      margin-bottom: 10px;
    }
    .countdown-number {
      font-size: 42px;
      font-weight: 700;
      color: #111111;
      line-height: 1;
      margin-bottom: 14px;
      font-variant-numeric: tabular-nums;
    }
    .progress-bar-bg {
      background: #e8e8e8;
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 100%;
      background: #111111;
      border-radius: 99px;
      transform-origin: left;
      animation: countdown 7s linear forwards;
    }
    @keyframes countdown {
      from { transform: scaleX(1); }
      to   { transform: scaleX(0); }
    }
    .btn-redirect {
      display: inline-block;
      width: 100%;
      padding: 14px 24px;
      background: #111111;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, transform 0.15s;
      margin-bottom: 12px;
    }
    .btn-redirect:hover { background: #333333; transform: translateY(-1px); }
    .btn-skip {
      font-size: 13px;
      color: #999999;
      cursor: pointer;
      background: none;
      border: none;
      font-family: 'Inter', sans-serif;
      text-decoration: underline;
    }
    .btn-skip:hover { color: #555555; }
    @media (max-width: 480px) {
      .card { padding: 36px 24px 32px; }
      h1 { font-size: 20px; }
      .countdown-number { font-size: 36px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="images/logo.png" alt="eNotas">
    </div>

    <div class="icon-wrap">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2.5c2.8 1.7 4.5 4.7 4.5 8.5 0 2.4-.7 4.6-1.8 6.3L12 21.5l-2.7-4.2C8.2 15.6 7.5 13.4 7.5 11c0-3.8 1.7-6.8 4.5-8.5z"/>
        <circle cx="12" cy="10.5" r="1.8" fill="#ffffff" stroke="none"/>
        <path d="M7.5 14c-1.8.4-2.8 1.7-3.2 4 2.1-.4 3.4-1.4 4-3"/>
        <path d="M16.5 14c1.8.4 2.8 1.7 3.2 4-2.1-.4-3.4-1.4-4-3"/>
      </svg>
    </div>

    <h1>O guia de configurações foi atualizado</h1>
    <p class="subtitle">
      Unificamos todas as configurações em um novo guia interativo.<br>
      Você será redirecionado automaticamente.
    </p>

    <div class="countdown-wrap">
      <p class="countdown-label">Redirecionando em</p>
      <div class="countdown-number" id="countdown">7</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <a class="btn-redirect" href="https://enotas.com.br/guiaconfiguracoes/">
      Ir agora para o guia de configurações
    </a>
    <br>
    <button class="btn-skip" onclick="cancelRedirect()">Cancelar redirecionamento</button>
  </div>

  <script>
    let seconds = 7;
    let timer = null;
    let redirectTimer = null;

    function tick() {
      seconds--;
      document.getElementById("countdown").textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = "https://enotas.com.br/guiaconfiguracoes/";
      }
    }

    function cancelRedirect() {
      clearInterval(timer);
      clearTimeout(redirectTimer);
      document.getElementById("progressBar").style.animation = "none";
      document.getElementById("progressBar").style.transform = "scaleX(0)";
      document.getElementById("countdown").textContent = "—";
      document.querySelector(".countdown-label").textContent = "Redirecionamento cancelado";
      document.querySelector(".btn-skip").style.display = "none";
    }

    timer = setInterval(tick, 1000);
  </script>
</body>
</html>
